name: 测试版 Mesa (aarch64, Auto Update + Detailed Log)
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check-updates:
    runs-on: ubuntu-24.04-arm
    outputs:
      new_commit: ${{ steps.check.outputs.new_commit }}
      latest_hash: ${{ steps.check.outputs.latest_hash }}
    steps:
      - name: 检查 Mesa 上游更新
        id: check
        run: |
          echo "🔍 检查 Mesa 上游提交..."
          LATEST_HASH=$(git ls-remote https://gitlab.freedesktop.org/mesa/mesa.git refs/heads/main | awk '{print $1}')
          echo "最新上游提交: $LATEST_HASH"
          
          STATE_FILE=".mesa_latest_commit"
          if [ -f "$STATE_FILE" ]; then
            LAST_HASH=$(cat $STATE_FILE)
          else
            LAST_HASH=""
          fi
          echo "上次构建: $LAST_HASH"
          
          if [ "$LATEST_HASH" != "$LAST_HASH" ]; then
            echo "new_commit=true" >> $GITHUB_OUTPUT
            echo "latest_hash=$LATEST_HASH" >> $GITHUB_OUTPUT
          else
            echo "new_commit=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-updates
    concurrency:
      group: turnip-release
      cancel-in-progress: false
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 显示构建环境信息
        run: |
          lsb_release -a || true
          uname -a
          lscpu | grep -E 'Model name|Architecture|CPU MHz|Core'
          free -h
          df -h
      
      - name: 安装依赖
        run: |
          sudo sed -i "s/^Types: deb$/Types: deb deb-src/" /etc/apt/sources.list.d/ubuntu.sources
          sudo apt update
          sudo apt install -y glslang-tools libxrandr-dev libxxf86vm-dev libxcb-shm0-dev libxcb-glx0-dev \
            libxext-dev llvm-19 libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri3-dev libxcb-present-dev \
            libxcb-randr0-dev libxcb-sync-dev libxcb-xfixes0-dev libxshmfence-dev libdrm-dev \
            libgbm-dev libegl1-mesa-dev libexpat1-dev libwayland-dev python3-pip
          pip3 install --user meson ninja mako
      
      - name: 克隆 Mesa 正式版
        run: |
          echo "📥 克隆 Mesa 仓库..."
          git clone https://github.com/as14725836/mesa-for-android-container.git mesa
          cd mesa
          git checkout adreno-main-27
          git pull
          echo "🧾 当前分支和提交:"
          git branch -v
          git log -1 --oneline --decorate
          
      - name: 自定义品牌
        run: |
          echo "🔧 自定义品牌: Turnip → Qualcomm Snapdragon"
          cd mesa
          sed -i 's/Turnip Adreno (TM) %s%s/XmoBox turnip (TM) %s%s/' src/freedreno/vulkan/tu_device.cc
          sed -i 's/"turnip Mesa driver"/"XmoBox turnip Driver"/' src/freedreno/vulkan/tu_device.cc
          sed -i 's/"Mesa " PACKAGE_VERSION MESA_GIT_SHA1/"XmoBox turnip " PACKAGE_VERSION MESA_GIT_SHA1/' src/freedreno/vulkan/tu_device.cc

      - name: 注入 static-libgl 支持 (单文件 zink)
        run: |
          # 给 mesa 源码加 -Dstatic-libgl 选项：把 gallium(zink+freedreno)
          # 整条链静态内联进 libGL.so.1；开启后运行时不再需要独立的
          # libgallium-<ver>.so，zink 只需一个文件。默认关闭，保持原行为。
          python3 ci/inject_static_libgl.py mesa
          
      - name: 构建 Mesa
        run: |
          cd mesa
          BUILD_START=$(date +%s)
          sudo mkdir -p /data/data/com.termux/files/usr/glibc
          sudo chmod 777 -R /data

          # 设置编译器
          export CC=clang
          export CXX=clang++
          
          mkdir -p builddir
          meson setup builddir \
            --libdir=lib \
            -Dprefix=/data/data/com.termux/files/usr/glibc \
            -Dbuildtype=release \
            -Dplatforms=x11 \
            -Degl-native-platform=x11 \
            -Dglx=dri \
            -Dglx-direct=true \
            -Dopengl=true \
            -Dgles1=enabled \
            -Dgles2=enabled \
            -Dglvnd=disabled \
            -Degl=enabled \
            -Dllvm=disabled \
            -Dshared-llvm=enabled \
            -Dshader-cache=enabled \
            -Dshared-glapi=enabled \
            -Dxlib-lease=enabled \
            -Dvulkan-beta=true \
            -Dlibunwind=disabled \
            -Dvalgrind=disabled \
            -Dmicrosoft-clc=disabled \
            -Dgallium-rusticl=false \
            -Dgallium-extra-hud=true \
            -Dgallium-drivers=zink,freedreno \
            -Dgallium-rusticl-enable-drivers=freedreno \
            -Dshader-cache-default=true \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dvideo-codecs=all \
            -Dgbm=disabled \
            -Db_ndebug=true \
            -Dstatic-libgl=false \
            -Dstrip=true
          
          ninja -C builddir -j$(nproc)
          ninja -C builddir install
          
          BUILD_END=$(date +%s)
          echo "构建耗时: $((BUILD_END - BUILD_START)) 秒"
          
          VERSION=$(cat VERSION)
          GIT_HASH=$(git rev-parse --short HEAD)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "GIT_HASH=${GIT_HASH}" >> $GITHUB_ENV
      
      - name: 计算发布版本号
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "🔢 计算下一个发布版本号（基于 Git 标签 + Release 实际存在性）..."
          PREFIX="xmobox-turnip-a8xx-gen8-V"
          
          # 1) 收集所有匹配的 Git 标签
          TAG_LIST=$(git tag -l "${PREFIX}*" 2>/dev/null || true)
          if [ -z "$TAG_LIST" ]; then
            TAG_LIST=$(git ls-remote --tags origin "refs/tags/${PREFIX}*" 2>/dev/null | awk -F/ '{print $NF}' || true)
          fi
          echo "现有 Git 标签："
          echo "${TAG_LIST:-（无）}" | sed 's/^/  - /'

          # 2) 收集所有现存 Release 的标签名
          echo "查询 GitHub 现存 Release..."
          RELEASE_LIST=$(gh release list --limit 200 --json tagName --jq '.[].tagName' 2>/dev/null || true)
          echo "现存 Release："
          echo "${RELEASE_LIST:-（无）}" | sed 's/^/  - /'

          # 3) 合并候选，并只统计"仍然存在的 Release"或"标签存在但从未发布过"的最大值
          #    规则：版本号必须 > 所有现存 Release 的版本号；
          #          同时也要 > 所有 Git 标签中仍对应 Release 的版本号。
          MAX=0
          for t in $TAG_LIST $RELEASE_LIST; do
            case "$t" in
              ${PREFIX}*) ;;
              *) continue ;;
            esac
            n=${t##*${PREFIX}}
            case "$n" in ''|*[!0-9]*) continue ;; esac
            if [ "$n" -gt "$MAX" ]; then MAX=$n; fi
          done

          # 4) 如果某个标签对应的 Release 已被删除，需要排除该标签带来的"虚高"。
          #    重新扫描：对每个候选 n，检查 n 是否"有意义"（Release 存在，或标签存在且无任何 Release 大于它）
          #    简化策略：最终 MAX 取
          #      a) 现存 Release 最大值
          #      b) 若不存在任何 Release，则取 Git 标签最大值
          MAX_REL=0
          for t in $RELEASE_LIST; do
            case "$t" in
              ${PREFIX}*) ;;
              *) continue ;;
            esac
            n=${t##*${PREFIX}}
            case "$n" in ''|*[!0-9]*) continue ;; esac
            if [ "$n" -gt "$MAX_REL" ]; then MAX_REL=$n; fi
          done

          MAX_TAG=0
          for t in $TAG_LIST; do
            case "$t" in
              ${PREFIX}*) ;;
              *) continue ;;
            esac
            n=${t##*${PREFIX}}
            case "$n" in ''|*[!0-9]*) continue ;; esac
            if [ "$n" -gt "$MAX_TAG" ]; then MAX_TAG=$n; fi
          done

          if [ "$MAX_REL" -gt 0 ]; then
            BASE=$MAX_REL
            echo "基于现存 Release 最大值：V${BASE}"
          else
            BASE=$MAX_TAG
            echo "无现存 Release，基于 Git 标签最大值：V${BASE}"
          fi

          NEXT=$((BASE + 1))
          echo "TAG=${PREFIX}${NEXT}" >> "$GITHUB_ENV"
          echo "本次版本: ${PREFIX}${NEXT}"

      - name: 打包构建产物
        run: |
          echo "📦 开始打包 ${TAG}.tar.gz..."
          cd mesa
          PACK_START=$(date +%s)
          
          TAR_NAME="${TAG}.tar.gz"
          tar -czvf "../${TAR_NAME}" -C builddir/src/freedreno/vulkan libvulkan_freedreno.so
          
          
          cd ..
          sha256sum "${TAR_NAME}" > "${TAR_NAME}.sha256"
          
          PACK_END=$(date +%s)
          echo "打包耗时: $((PACK_END - PACK_START)) 秒"
          
          echo "TAR_NAME=${TAR_NAME}" >> $GITHUB_ENV

      - name: 上传构建产物到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAG }}
          path: |
            ${{ env.TAR_NAME }}
            ${{ env.TAR_NAME }}.sha256
      
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=/tmp/release-notes.md
          {
            echo "## XmoBox Turnip A8xx Gen8 ${TAG##*-}"
            echo
            echo "- Mesa 版本: ${VERSION}"
            echo "- Mesa 提交: ${GIT_HASH}"
            echo "- 构建时间: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- 平台: Adreno 8xx / KGSL / aarch64 (termux glibc)"
            echo
            echo "### 本次更新"
            git -C mesa log --oneline -12 | sed 's/^/- /'
            echo
            echo "### 包内容"
            echo "- \`${TAR_NAME}\`：仅 \`libvulkan_freedreno.so\`（turnip）"
            echo "> zink 的单文件 \`libGL.so.1\` 由 zink-static job 单独发布。"
            echo
            echo "### 优化"
            echo "- 仅打包 libvulkan_freedreno.so，解压后直接覆盖 \$PREFIX/glibc/lib/libvulkan_freedreno.so"
            echo "- 启用 GLX-DRI3 与 EGL-DRI3（x11），X11 下可直接呈现"
            echo "- 关闭 LLVM / libunwind / valgrind / GBM / glvnd，减少运行时依赖"
            echo "- -O3 release 构建；不启用 ThinLTO，避免额外 lld 依赖"
            echo "- 修复 KGSL surfaceless 的 loader_funcs 赋值（此前 EGL 无法编译）"
            echo "- 设备表补充 A830 KGSL rev0 (0x44050000)"
            echo
            echo "### 使用"
            echo '```'
            echo "# turnip (Vulkan)"
            echo "tar -xzf ${TAR_NAME} -C \$PREFIX/glibc/lib"
            echo
            echo '```'
            echo
          } > "$NOTES"
          gh release create "${TAG}" "${TAR_NAME}" "${TAR_NAME}.sha256" \
            --title "XmoBox Turnip A8xx Gen8 ${TAG##*-}" \
            --notes-file "$NOTES"

      - name: 保存最新提交记录
        if: ${{ needs.check-updates.outputs.latest_hash != '' }}
        run: |
          echo "${{ needs.check-updates.outputs.latest_hash }}" > .mesa_latest_commit
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .mesa_latest_commit || true
          git commit -m "Update Mesa commit record" || true
          git push || true
      
      - name: 输出总结信息
        run: |
          echo "构建完成"
          echo "版本: ${{ env.VERSION }}"
          echo "提交: ${{ env.GIT_HASH }}"
          echo "构建产物已保存到 Artifacts"
          echo "- ${{ env.TAR_NAME }}"

  # -------------------------------------------------------------------
  # zink-static：把 gallium 全部静态内联，产出单文件 libGL.so.1
  #
  # 与上面 build job 完全独立（不复用其产物），只在 static-libgl 选项上
  # 不同。产出 zink-static-<TAG>.tar.gz，内含唯一一个 libGL.so.1，
  # 解压覆盖即可，不再需要配对的 libgallium-<ver>.so。
  #
  # 用途：需要"一个文件就是全部"的场合（如打包进 deb/AppImage、
  # 或避免 libgallium 版本错配）。
  # 注意：此版本不含任何外部 DRI 驱动加载能力（swrast_dri.so 等），
  # zink + freedreno 已内建，日常使用无差别。
  # -------------------------------------------------------------------
  zink-static:
    needs: check-updates
    concurrency:
      group: zink-static-release
      cancel-in-progress: false
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装依赖
        run: |
          sudo sed -i "s/^Types: deb$/Types: deb deb-src/" /etc/apt/sources.list.d/ubuntu.sources
          sudo apt update
          sudo apt install -y glslang-tools libxrandr-dev libxxf86vm-dev libxcb-shm0-dev libxcb-glx0-dev \
            libxext-dev llvm-19 libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri3-dev libxcb-present-dev \
            libxcb-randr0-dev libxcb-sync-dev libxcb-xfixes0-dev libxshmfence-dev libdrm-dev \
            libgbm-dev libegl1-mesa-dev libexpat1-dev libwayland-dev python3-pip \
            libarchive-dev
          pip3 install --user meson ninja mako

      - name: 克隆 Mesa 正式版
        run: |
          git clone https://github.com/as14725836/mesa-for-android-container.git mesa
          cd mesa
          git checkout adreno-main-27
          git pull

      - name: 自定义品牌
        run: |
          cd mesa
          sed -i 's/Turnip Adreno (TM) %s%s/XmoBox turnip (TM) %s%s/' src/freedreno/vulkan/tu_device.cc
          sed -i 's/"turnip Mesa driver"/"XmoBox turnip Driver"/' src/freedreno/vulkan/tu_device.cc

      - name: 计算发布版本号
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PREFIX="xmobox-turnip-a8xx-gen8-V"
          MAX=0
          RELEASE_LIST=$(gh release list --limit 200 --json tagName --jq '.[].tagName' 2>/dev/null || true)
          for t in $RELEASE_LIST; do
            case "$t" in ${PREFIX}*) ;; *) continue ;; esac
            n=${t##*${PREFIX}}
            case "$n" in ''|*[!0-9]*) continue ;; esac
            [ "$n" -gt "$MAX" ] && MAX=$n
          done
          NEXT=$((MAX + 1))
          echo "TAG=${PREFIX}${NEXT}" >> "$GITHUB_ENV"
          echo "本次版本: ${PREFIX}${NEXT}"

      - name: 注入 static-libgl 支持
        run: python3 ci/inject_static_libgl.py mesa

      - name: 构建 (static-libgl=true)
        run: |
          cd mesa
          export CC=clang
          export CXX=clang++
          mkdir -p builddir
          meson setup builddir \
            --wrap-mode=nofallback \
            --libdir=lib \
            -Dprefix=/tmp/zink-static-install \
            -Dbuildtype=release \
            -Dplatforms=x11 \
            -Degl-native-platform=x11 \
            -Dglx=dri \
            -Dglx-direct=true \
            -Dopengl=true \
            -Dgles1=enabled \
            -Dgles2=enabled \
            -Dglvnd=disabled \
            -Degl=enabled \
            -Dllvm=disabled \
            -Dshared-llvm=enabled \
            -Dshader-cache=enabled \
            -Dshared-glapi=enabled \
            -Dxlib-lease=enabled \
            -Dvulkan-beta=true \
            -Dlibunwind=disabled \
            -Dvalgrind=disabled \
            -Dmicrosoft-clc=disabled \
            -Dgallium-rusticl=false \
            -Dgallium-extra-hud=true \
            -Dgallium-drivers=zink,freedreno \
            -Dshader-cache-default=true \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dvideo-codecs=all \
            -Dgbm=disabled \
            -Db_ndebug=true \
            -Dstatic-libgl=true \
            -Dstrip=true
          ninja -C builddir -j$(nproc)

      - name: 校验单文件结果
        run: |
          set -e
          LIBGL=$(find mesa/builddir -name 'libGL.so.1.2.0' | head -1)
          echo "libGL: $LIBGL"
          ls -la "$LIBGL"
          echo "--- DT_NEEDED ---"
          readelf -d "$LIBGL" | grep NEEDED || true
          if readelf -d "$LIBGL" | grep -q 'NEEDED.*libgallium'; then
            echo "❌ 仍依赖 libgallium，静态内联失败"
            exit 1
          fi
          echo "✅ 无 libgallium 依赖，单文件成立"
          echo "--- 关键符号 ---"
          nm -D --defined-only "$LIBGL" | grep -cE '^.* T (gl|glX)' || true

      - name: 打包
        run: |
          set -e
          STAGE="$PWD/zstatic-stage"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          LIBGL=$(find mesa/builddir -name 'libGL.so.1.2.0' | head -1)
          [ -n "$LIBGL" ] || { echo "❌ 找不到 libGL.so.1.2.0"; exit 1; }
          cp -av "$LIBGL" "$STAGE/libGL.so.1.2.0"
          ln -sf libGL.so.1.2.0 "$STAGE/libGL.so.1"
          ln -sf libGL.so.1 "$STAGE/libGL.so"

          ZTAR="zink-static-${TAG}.tar.gz"
          tar -czf "$ZTAR" -C "$STAGE" .
          sha256sum "$ZTAR" > "${ZTAR}.sha256"
          echo "ZTAR_STATIC=${ZTAR}" >> "$GITHUB_ENV"
          echo "✅ $ZTAR ($(du -h "$ZTAR" | cut -f1))"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAG }}-zink-static
          path: |
            ${{ env.ZTAR_STATIC }}
            ${{ env.ZTAR_STATIC }}.sha256

      - name: 追加到 Release
        if: ${{ env.TAG != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # zink-static 与 build 并行跑，而 Release 是 build job 创建的。
          # 这里轮询等待 Release 出现（最多 15 分钟），而不要直接失败。
          ok=0
          for i in $(seq 1 60); do
            if gh release view "${TAG}" >/dev/null 2>&1; then ok=1; break; fi
            echo "[$i/60] Release ${TAG} 尚未就绪，5s 后重试..."
            sleep 5
          done
          if [ "$ok" = "1" ]; then
            gh release upload "${TAG}" "${ZTAR_STATIC}" "${ZTAR_STATIC}.sha256" --clobber
            echo "✅ 已追加到 Release ${TAG}"
          else
            echo "⚠️ 等待 15 分钟仍未找到 Release ${TAG}，仅保留 artifact"
          fi
