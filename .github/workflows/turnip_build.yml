name: 测试版 Mesa (aarch64, Auto Update + Detailed Log)
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check-updates:
    runs-on: ubuntu-24.04-arm
    outputs:
      new_commit: ${{ steps.check.outputs.new_commit }}
      latest_hash: ${{ steps.check.outputs.latest_hash }}
    steps:
      - name: 检查 Mesa 上游更新
        id: check
        run: |
          echo "🔍 检查 Mesa 上游提交..."
          LATEST_HASH=$(git ls-remote https://gitlab.freedesktop.org/mesa/mesa.git refs/heads/main | awk '{print $1}')
          echo "最新上游提交: $LATEST_HASH"
          
          STATE_FILE=".mesa_latest_commit"
          if [ -f "$STATE_FILE" ]; then
            LAST_HASH=$(cat $STATE_FILE)
          else
            LAST_HASH=""
          fi
          echo "上次构建: $LAST_HASH"
          
          if [ "$LATEST_HASH" != "$LAST_HASH" ]; then
            echo "new_commit=true" >> $GITHUB_OUTPUT
            echo "latest_hash=$LATEST_HASH" >> $GITHUB_OUTPUT
          else
            echo "new_commit=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-updates
    concurrency:
      group: turnip-release
      cancel-in-progress: false
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 显示构建环境信息
        run: |
          lsb_release -a || true
          uname -a
          lscpu | grep -E 'Model name|Architecture|CPU MHz|Core'
          free -h
          df -h
      
      - name: 安装依赖
        run: |
          sudo sed -i "s/^Types: deb$/Types: deb deb-src/" /etc/apt/sources.list.d/ubuntu.sources
          sudo apt update
          sudo apt install -y glslang-tools libxrandr-dev libxxf86vm-dev libxcb-shm0-dev libxcb-glx0-dev \
            libxext-dev llvm-19 libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri3-dev libxcb-present-dev \
            libxcb-randr0-dev libxcb-sync-dev libxcb-xfixes0-dev libxshmfence-dev libdrm-dev \
            libgbm-dev libegl1-mesa-dev libexpat1-dev libwayland-dev python3-pip
          pip3 install --user meson ninja mako
      
      - name: 克隆 Mesa 正式版
        run: |
          echo "📥 克隆 Mesa 仓库..."
          git clone https://github.com/as14725836/mesa-for-android-container.git mesa
          cd mesa
          echo "🧾 当前分支和提交:"
          git branch -v
          git log -1 --oneline --decorate
          
      - name: 自定义品牌
        run: |
          echo "🔧 自定义品牌: Turnip → Qualcomm Snapdragon"
          cd mesa
          sed -i 's/Turnip Adreno (TM) %s%s/XmoBox turnip (TM) %s%s/' src/freedreno/vulkan/tu_device.cc
          sed -i 's/"turnip Mesa driver"/"XmoBox turnip Driver"/' src/freedreno/vulkan/tu_device.cc
          sed -i 's/"Mesa " PACKAGE_VERSION MESA_GIT_SHA1/"XmoBox turnip " PACKAGE_VERSION MESA_GIT_SHA1/' src/freedreno/vulkan/tu_device.cc

      - name: 注入 static-libgl 支持 (单文件 zink)
        run: |
          # 给 mesa 源码加 -Dstatic-libgl 选项：把 gallium(zink+freedreno)
          # 整条链静态内联进 libGL.so.1；开启后运行时不再需要独立的
          # libgallium-<ver>.so，zink 只需一个文件。默认关闭，保持原行为。
          python3 ci/inject_static_libgl.py mesa
          # libEGL 静态内联（仅 static-libgl=true 时生效）
          python3 ci/inject_static_egl.py mesa
          # kgsl in-fence EDEADLK 修复（见 inject_kgsl_cpu_wait_fence.py）
          python3 ci/inject_kgsl_cpu_wait_fence.py mesa
          # 补齐 kgsl context 的功率约束（对齐 turnip tu_knl_kgsl.cc）：
          # 缺 PWR_CONSTRAINT 时本机内核让真正的渲染提交返回 EDEADLK。
          python3 ci/inject_kgsl_pwr_constraint.py mesa
          # 提交诊断：LG_KGSL_DIAG=1 时打印每笔 GPU_COMMAND 的 ctx/IB/errno，
          # 用来定位 EDEADLK。默认关闭。
          python3 ci/inject_kgsl_submit_diag.py mesa
          python3 ci/inject_kgsl_ctx_flags.py mesa
          python3 ci/inject_kgsl_submit_keepalive.py mesa
          
      - name: 构建 Mesa
        run: |
          cd mesa
          BUILD_START=$(date +%s)
          sudo mkdir -p /data/data/com.termux/files/usr/glibc
          sudo chmod 777 -R /data

          # 设置编译器
          export CC=clang
          export CXX=clang++
          
          mkdir -p builddir
          meson setup builddir \
            --libdir=lib \
            -Dprefix=/data/data/com.termux/files/usr/glibc \
            -Dbuildtype=release \
            -Dplatforms=x11 \
            -Degl-native-platform=x11 \
            -Dglx=dri \
            -Dglx-direct=true \
            -Dopengl=true \
            -Dgles1=enabled \
            -Dgles2=enabled \
            -Dglvnd=disabled \
            -Degl=enabled \
            -Dllvm=disabled \
            -Dshared-llvm=enabled \
            -Dshader-cache=enabled \
            -Dshared-glapi=enabled \
            -Dxlib-lease=enabled \
            -Dvulkan-beta=true \
            -Dlibunwind=disabled \
            -Dvalgrind=disabled \
            -Dmicrosoft-clc=disabled \
            -Dgallium-rusticl=false \
            -Dgallium-extra-hud=true \
            -Dgallium-drivers=zink,freedreno \
            -Dgallium-rusticl-enable-drivers=freedreno \
            -Dshader-cache-default=true \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dvideo-codecs=all \
            -Dgbm=disabled \
            -Db_ndebug=true \
            -Dstatic-libgl=false \
            -Dstrip=true
          
          ninja -C builddir -j$(nproc)
          ninja -C builddir install
          
          BUILD_END=$(date +%s)
          echo "构建耗时: $((BUILD_END - BUILD_START)) 秒"
          
          VERSION=$(cat VERSION)
          GIT_HASH=$(git rev-parse --short HEAD)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "GIT_HASH=${GIT_HASH}" >> $GITHUB_ENV
      
      - name: 计算发布版本号
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "🔢 计算下一个发布版本号（基于 Git 标签 + Release 实际存在性）..."
          PREFIX="xmobox-turnip-a8xx-gen8-V"
          
          # 1) 收集所有匹配的 Git 标签
          TAG_LIST=$(git tag -l "${PREFIX}*" 2>/dev/null || true)
          if [ -z "$TAG_LIST" ]; then
            TAG_LIST=$(git ls-remote --tags origin "refs/tags/${PREFIX}*" 2>/dev/null | awk -F/ '{print $NF}' || true)
          fi
          echo "现有 Git 标签："
          echo "${TAG_LIST:-（无）}" | sed 's/^/  - /'

          # 2) 收集所有现存 Release 的标签名
          echo "查询 GitHub 现存 Release..."
          RELEASE_LIST=$(gh release list --limit 200 --json tagName --jq '.[].tagName' 2>/dev/null || true)
          echo "现存 Release："
          echo "${RELEASE_LIST:-（无）}" | sed 's/^/  - /'

          # 3) 合并候选，并只统计"仍然存在的 Release"或"标签存在但从未发布过"的最大值
          #    规则：版本号必须 > 所有现存 Release 的版本号；
          #          同时也要 > 所有 Git 标签中仍对应 Release 的版本号。
          MAX=0
          for t in $TAG_LIST $RELEASE_LIST; do
            case "$t" in
              ${PREFIX}*) ;;
              *) continue ;;
            esac
            n=${t##*${PREFIX}}
            case "$n" in ''|*[!0-9]*) continue ;; esac
            if [ "$n" -gt "$MAX" ]; then MAX=$n; fi
          done

          # 4) 如果某个标签对应的 Release 已被删除，需要排除该标签带来的"虚高"。
          #    重新扫描：对每个候选 n，检查 n 是否"有意义"（Release 存在，或标签存在且无任何 Release 大于它）
          #    简化策略：最终 MAX 取
          #      a) 现存 Release 最大值
          #      b) 若不存在任何 Release，则取 Git 标签最大值
          MAX_REL=0
          for t in $RELEASE_LIST; do
            case "$t" in
              ${PREFIX}*) ;;
              *) continue ;;
            esac
            n=${t##*${PREFIX}}
            case "$n" in ''|*[!0-9]*) continue ;; esac
            if [ "$n" -gt "$MAX_REL" ]; then MAX_REL=$n; fi
          done

          MAX_TAG=0
          for t in $TAG_LIST; do
            case "$t" in
              ${PREFIX}*) ;;
              *) continue ;;
            esac
            n=${t##*${PREFIX}}
            case "$n" in ''|*[!0-9]*) continue ;; esac
            if [ "$n" -gt "$MAX_TAG" ]; then MAX_TAG=$n; fi
          done

          if [ "$MAX_REL" -gt 0 ]; then
            BASE=$MAX_REL
            echo "基于现存 Release 最大值：V${BASE}"
          else
            BASE=$MAX_TAG
            echo "无现存 Release，基于 Git 标签最大值：V${BASE}"
          fi

          NEXT=$((BASE + 1))
          echo "TAG=${PREFIX}${NEXT}" >> "$GITHUB_ENV"
          echo "本次版本: ${PREFIX}${NEXT}"

      - name: 打包构建产物
        run: |
          echo "📦 开始打包 ${TAG}.tar.gz..."
          cd mesa
          PACK_START=$(date +%s)
          
          TAR_NAME="${TAG}.tar.gz"
          tar -czvf "../${TAR_NAME}" -C builddir/src/freedreno/vulkan libvulkan_freedreno.so
          
          
          cd ..
          sha256sum "${TAR_NAME}" > "${TAR_NAME}.sha256"
          
          PACK_END=$(date +%s)
          echo "打包耗时: $((PACK_END - PACK_START)) 秒"
          
          echo "TAR_NAME=${TAR_NAME}" >> $GITHUB_ENV

      - name: 上传构建产物到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAG }}
          path: |
            ${{ env.TAR_NAME }}
            ${{ env.TAR_NAME }}.sha256
      
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=/tmp/release-notes.md
          {
            echo "## XmoBox Turnip A8xx Gen8 ${TAG##*-}"
            echo
            echo "- Mesa 版本: ${VERSION}"
            echo "- Mesa 提交: ${GIT_HASH}"
            echo "- 构建时间: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- 平台: Adreno 8xx / KGSL / aarch64 (termux glibc)"
            echo
            echo "### 本次更新"
            git -C mesa log --oneline -12 | sed 's/^/- /'
            echo
            echo "### 包内容"
            echo "- \`${TAR_NAME}\`：仅 \`libvulkan_freedreno.so\`（turnip）"
            echo "> zink 由 zink-static job 单独发布为 \`zink-static-${TAG}.tar.gz\`："
            echo "> 包内仅一个 \`libGL.so.1\`（已内置 gallium/zink，无 libgallium-<ver>.so 依赖），"
            echo "> 解压覆盖到 \$PREFIX/glibc/lib 即完成替换，无需再配 libgallium。"
            echo "> 注：Mesa 编译实体名为 libGL.so.1.2.0（SONAME 为 libGL.so.1），"
            echo "> 包内已把实体直接命名为 libGL.so.1，避免软链指向旧文件。"
            echo "> 体积优化：strip 掉 2.5 MB 静态符号表；只编 zink 不编 freedreno 驱动。"
            echo
            echo "### 优化"
            echo "- 仅打包 libvulkan_freedreno.so，解压后直接覆盖 \$PREFIX/glibc/lib/libvulkan_freedreno.so"
            echo "- 启用 GLX-DRI3 与 EGL-DRI3（x11），X11 下可直接呈现"
            echo "- 关闭 LLVM / libunwind / valgrind / GBM / glvnd，减少运行时依赖"
            echo "- -O3 release 构建；turnip 包不启用 ThinLTO"
            echo "- 修复 KGSL surfaceless 的 loader_funcs 赋值（此前 EGL 无法编译）"
            echo "- 设备表补充 A830 KGSL rev0 (0x44050000)"
            echo
            echo "### 使用"
            echo '```'
            echo "# turnip (Vulkan)"
            echo "tar -xzf ${TAR_NAME} -C \$PREFIX/glibc/lib"
            echo
            echo '```'
            echo
          } > "$NOTES"
          gh release create "${TAG}" "${TAR_NAME}" "${TAR_NAME}.sha256" \
            --title "XmoBox Turnip A8xx Gen8 ${TAG##*-}" \
            --notes-file "$NOTES"

      - name: 保存最新提交记录
        if: ${{ needs.check-updates.outputs.latest_hash != '' }}
        run: |
          echo "${{ needs.check-updates.outputs.latest_hash }}" > .mesa_latest_commit
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .mesa_latest_commit || true
          git commit -m "Update Mesa commit record" || true
          git push || true
      
      - name: 输出总结信息
        run: |
          echo "构建完成"
          echo "版本: ${{ env.VERSION }}"
          echo "提交: ${{ env.GIT_HASH }}"
          echo "构建产物已保存到 Artifacts"
          echo "- ${{ env.TAR_NAME }}"

  # -------------------------------------------------------------------
  # zink-static：把 gallium 全部静态内联，产出单文件 libGL.so.1
  #
  # 与上面 build job 完全独立（不复用其产物），只在 static-libgl 选项上
  # 不同。产出 zink-static-<TAG>.tar.gz，内含唯一一个 libGL.so.1，
  # 解压覆盖即可，不再需要配对的 libgallium-<ver>.so。
  #
  # 用途：需要"一个文件就是全部"的场合（如打包进 deb/AppImage、
  # 或避免 libgallium 版本错配）。
  # 注意：此版本不含任何外部 DRI 驱动加载能力（swrast_dri.so 等），
  # zink + freedreno 已内建，日常使用无差别。
  # -------------------------------------------------------------------
  zink-static:
    needs: check-updates
    concurrency:
      group: zink-static-release
      cancel-in-progress: false
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装依赖
        run: |
          sudo sed -i "s/^Types: deb$/Types: deb deb-src/" /etc/apt/sources.list.d/ubuntu.sources
          sudo apt update
          sudo apt install -y glslang-tools libxrandr-dev libxxf86vm-dev libxcb-shm0-dev libxcb-glx0-dev \
            libxext-dev llvm-19 libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri3-dev libxcb-present-dev \
            libxcb-randr0-dev libxcb-sync-dev libxcb-xfixes0-dev libxshmfence-dev libdrm-dev \
            libgbm-dev libegl1-mesa-dev libexpat1-dev libwayland-dev python3-pip \
            libarchive-dev
          pip3 install --user meson ninja mako

      - name: 克隆 Mesa 正式版
        run: |
          git clone https://github.com/as14725836/mesa-for-android-container.git mesa
          cd mesa

      - name: 自定义品牌
        run: |
          cd mesa
          sed -i 's/Turnip Adreno (TM) %s%s/XmoBox turnip (TM) %s%s/' src/freedreno/vulkan/tu_device.cc
          sed -i 's/"turnip Mesa driver"/"XmoBox turnip Driver"/' src/freedreno/vulkan/tu_device.cc

      - name: 计算发布版本号
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PREFIX="xmobox-turnip-a8xx-gen8-V"
          MAX=0
          RELEASE_LIST=$(gh release list --limit 200 --json tagName --jq '.[].tagName' 2>/dev/null || true)
          for t in $RELEASE_LIST; do
            case "$t" in ${PREFIX}*) ;; *) continue ;; esac
            n=${t##*${PREFIX}}
            case "$n" in ''|*[!0-9]*) continue ;; esac
            [ "$n" -gt "$MAX" ] && MAX=$n
          done
          NEXT=$((MAX + 1))
          echo "TAG=${PREFIX}${NEXT}" >> "$GITHUB_ENV"
          echo "本次版本: ${PREFIX}${NEXT}"

      - name: 注入 static-libgl / static-egl 支持
        run: |
          python3 ci/inject_static_libgl.py mesa
          # 再把 libEGL 一并静态内联进 libGL.so.1（含 egl* 入口），
          # 让产物真正单文件：不再需要 libEGL.so.1 / libgallium-*.so。
          # 必须在上一步之后：它复用 libgallium_dri_static。
          python3 ci/inject_static_egl.py mesa
          # 让 EGL/kopper 也尊重 MESA_LOADER_DRIVER_OVERRIDE，
          # 并且支持在没有 /dev/dri 的环境下用 /dev/kgsl-3d0 跑原生 freedreno。
          # 默认行为不变（MESA_KOPPER_ZINK 默认 true），要试 kgsl 时设：
          #   MESA_KOPPER_ZINK=0 MESA_KOPPER_KGSL=/dev/kgsl-3d0 \
          #   MESA_LOADER_DRIVER_OVERRIDE=freedreno FD_FORCE_KGSL=1
          python3 ci/inject_kopper_driver_choice.py mesa
          # kgsl 后端不能用内核 syncpoint 传 in-fence：交换链的 fence 来自
          # 同一个 kgsl context，内核会判定自我等待并返回 EDEADLK
          # （"submit failed -1 (Resource deadlock avoided)"）。
          # 改成提交前在 CPU 侧等 fence signal，语义不变。
          python3 ci/inject_kgsl_cpu_wait_fence.py mesa
          # 补齐 kgsl context 的功率约束（对齐 turnip tu_knl_kgsl.cc）：
          # 缺 PWR_CONSTRAINT 时本机内核让真正的渲染提交返回 EDEADLK。
          python3 ci/inject_kgsl_pwr_constraint.py mesa
          # 提交诊断：LG_KGSL_DIAG=1 时打印每笔 GPU_COMMAND 的 ctx/IB/errno，
          # 用来定位 EDEADLK。默认关闭。
          python3 ci/inject_kgsl_submit_diag.py mesa
          python3 ci/inject_kgsl_ctx_flags.py mesa
          python3 ci/inject_kgsl_submit_keepalive.py mesa

      - name: 构建 (static-libgl=true)
        run: |
          cd mesa
          export CC=clang
          export CXX=clang++
          mkdir -p builddir
          meson setup builddir \
            --wrap-mode=nofallback \
            --libdir=lib \
            -Dprefix=/tmp/zink-static-install \
            -Dbuildtype=release \
            -Dplatforms=x11 \
            -Degl-native-platform=x11 \
            -Dglx=dri \
            -Dglx-direct=true \
            -Dopengl=true \
            -Dgles1=enabled \
            -Dgles2=enabled \
            -Dglvnd=disabled \
            -Degl=enabled \
            -Dllvm=disabled \
            -Dshared-llvm=enabled \
            -Dshader-cache=enabled \
            -Dshared-glapi=enabled \
            -Dxlib-lease=enabled \
            -Dvulkan-beta=true \
            -Dlibunwind=disabled \
            -Dvalgrind=disabled \
            -Dmicrosoft-clc=disabled \
            -Dgallium-rusticl=false \
            -Dgallium-extra-hud=true \
            -Dgallium-drivers=zink,freedreno \
            -Dshader-cache-default=true \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dvideo-codecs=all \
            -Dgbm=disabled \
            -Db_ndebug=true \
            -Dstatic-libgl=true \
            -Dstrip=true
          ninja -C builddir -j$(nproc)

      - name: 瘦身 (strip 调试与静态符号表)
        run: |
          set -e
          LIBGL=$(find mesa/builddir -name 'libGL.so.1.2.0' | head -1)
          [ -n "$LIBGL" ] || { echo "❌ 找不到 libGL.so.1.2.0"; exit 1; }
          echo "strip 前: $(stat -c %s "$LIBGL") 字节 ($(du -h "$LIBGL" | cut -f1))"
          # .symtab + .strtab 约 2.5 MB，运行时完全用不到；
          # 动态符号 (.dynsym) 保留，gl*/glX* 导出接口不受影响。
          #
          # 不能用 --strip-unneeded：驱动注册表（dri_target.c 展开的
          # *_driver_descriptor 结构体）就在 .data.rel.ro 里，是纯数据，
          # 只被同样无人引用的 driver_descriptors[] 数组指着。
          # --strip-unneeded 判定“重定位后不再需要”，会把 zink 这一项删掉，
          # 而走 STUB 分支的其它驱动因为自带 fprintf 字符串反而留下。
          # --keep-section=.data.rel.ro 在 binutils 上无效（strip 后字节数
          # 完全不变），所以改用 --strip-debug：只删 .debug_* 段，
          # 绝不碰 .data.rel.ro 里的注册表数据。
          strip --strip-debug "$LIBGL"
          echo "strip 后: $(stat -c %s "$LIBGL") 字节 ($(du -h "$LIBGL" | cut -f1))"
          echo "--- 确认调试段已移除 ---"
          if readelf -S "$LIBGL" | grep -qE '\.debug_'; then
            echo "❌ .debug_* 仍在"; exit 1
          fi
          echo "✅ 调试段已移除"
          echo "--- 确认动态符号仍在 ---"
          readelf -S "$LIBGL" | grep -E '\.dynsym|\.dynstr' || {
            echo "❌ 动态符号表被误删"; exit 1; }
          echo "✅ 导出符号数: $(nm -D --defined-only "$LIBGL" | grep -cE ' T (gl|glX)')"

      - name: 校验单文件结果
        run: |
          set -e
          LIBGL=$(find mesa/builddir -name 'libGL.so.1.2.0' | head -1)
          echo "libGL: $LIBGL"
          ls -la "$LIBGL"
          echo "--- DT_NEEDED ---"
          readelf -d "$LIBGL" | grep NEEDED || true
          if readelf -d "$LIBGL" | grep -q 'NEEDED.*libgallium'; then
            echo "❌ 仍依赖 libgallium，静态内联失败"
            exit 1
          fi
          echo "✅ 无 libgallium 依赖"
          # EGL 必须已静态内联：不能再有 libEGL 的 DT_NEEDED，
          # 且 egl* 入口符号要能在本文件里查得到。
          if readelf -d "$LIBGL" | grep -q 'NEEDED.*libEGL'; then
            echo "❌ 仍依赖 libEGL，EGL 静态内联失败"
            exit 1
          fi
          echo "✅ 无 libEGL 依赖，单文件成立"
          echo "--- EGL 入口符号 ---"
          NEGL=$(nm -D --defined-only "$LIBGL" | grep -cE ' T (egl|_egl)[A-Za-z_]')
          echo "egl* 导出符号数: $NEGL"
          if [ "$NEGL" -lt 20 ]; then
            echo "❌ egl* 符号过少（$NEGL），EGL 未真正内联"
            nm -D --defined-only "$LIBGL" | grep -E ' T egl' | head -20 || true
            exit 1
          fi
          for sym in eglGetDisplay eglInitialize eglCreateContext eglMakeCurrent eglSwapBuffers; do
            if ! nm -D --defined-only "$LIBGL" | grep -qE " T ${sym}\$"; then
              echo "❌ 缺少 EGL 入口: $sym"
              exit 1
            fi
          done
          echo "✅ EGL 关键入口齐全"
          echo "--- 关键符号 ---"
          nm -D --defined-only "$LIBGL" | grep -cE '^.* T (gl|glX)' || true
          echo "--- 驱动注册表自检（必须有 zink 注册项）---"
          # 只校验 zink：本构建 -Dgallium-drivers=zink,freedreno，
          # swrast 根本没编进来。它以前能"通过"纯属巧合——所有未启用
          # 驱动都有一个 DRM_DRIVER_DESCRIPTOR_STUB，其
          # fprintf(stderr, "swrast: driver missing\n") 里带着一个
          # 独立的 "swrast" 字符串，脚本的退化检测就把它当成驱动存在。
          # EGL 静态内联改变了链接布局，该字符串不再独立存在，这个
          # 假阳性随之暴露。真正的断言只有 zink。
          if ! python3 ci/check_driver_registry.py "$LIBGL" zink; then
            echo "❌ zink 驱动注册项缺失，运行期无法使用 zink"
            python3 ci/check_driver_registry.py --dump "$LIBGL" || true
            exit 1
          fi
          echo "✅ zink 注册项存在"

      - name: 打包
        run: |
          set -e
          STAGE="$PWD/zstatic-stage"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          LIBGL=$(find mesa/builddir -name 'libGL.so.1.2.0' | head -1)
          [ -n "$LIBGL" ] || { echo "❌ 找不到 libGL.so.1.2.0"; exit 1; }
          # Mesa 的实体名是 libGL.so.1.2.0（gl_lib_version=1.2.0），
          # 而 SONAME 是 libGL.so.1。把实体直接命名成 libGL.so.1，
          # 包里就只有这一个文件，解压覆盖即完成替换，
          # 不依赖 libGL.so.1.2.0，也不再夹带 libGL.so 编译期软链。
          cp -av "$LIBGL" "$STAGE/libGL.so.1"

          # ---------------------------------------------------------------
          # 额外提供 libEGL.so.1（指向同一个文件）
          #
          # 为什么光把 EGL 静态链进 libGL.so.1 还不够：
          # Wine 的 win32u/opengl.c:egl_init() 是这样拿 EGL 的——
          #     dlopen( SONAME_LIBEGL /* "libEGL.so.1" */, RTLD_NOW|RTLD_GLOBAL )
          #     dlsym( handle, "eglGetProcAddress" );  dlsym( handle, "eglQueryString" );
          # 其余全部函数再用 eglGetProcAddress() 取。
          # dlopen 是按"文件名"在搜索路径里找 .so，不会去 libGL.so.1 的
          # 符号表里翻。所以只内联不建这个文件，wgl 依然会报
          #   err:wgl:egl_init Failed to load libEGL.so.1
          #
          # libGL.so.1 已经导出了完整 EGL 1.5 的 44 个入口
          # （eglGetDisplay/eglInitialize/eglCreateContext/...），
          # 客户端扩展串里也带着 Wine 硬性要求的
          # EGL_KHR_client_get_all_proc_addresses 与 EGL_EXT_platform_base，
          # 因此同一个文件改名即可直接充当 libEGL 供应商。
          # 用符号链接而不是硬链接：
          # 硬链接在 tar 里是一个 size=0 的 'h' 条目（内容只存一份），
          # GNU tar 能正确还原，但 busybox/toybox 的 tar 不支持，
          # 会解出一个 0 字节的 libGL.so.1，Wine 加载直接失败，
          # 而且很难联想到是打包方式的问题。
          # 软链接是独立条目、只存一个路径串，所有 tar 都认。
          ln -s libGL.so.1 "$STAGE/libEGL.so.1"

          echo "--- 打包内容 ---"
          ls -la "$STAGE"

          # libEGL.so.1 必须是指向 libGL.so.1 的软链接，且能解析到实体。
          # 别让它变成 0 字节普通文件——那会让 wgl 拿到一个空库。
          if [ ! -L "$STAGE/libEGL.so.1" ]; then
            echo "❌ libEGL.so.1 不是符号链接"
            ls -la "$STAGE"
            exit 1
          fi
          if [ ! -f "$STAGE/libGL.so.1" ] || [ ! -s "$STAGE/libGL.so.1" ]; then
            echo "❌ libGL.so.1 缺失或为空"
            ls -la "$STAGE"
            exit 1
          fi
          [ "$(readlink -f "$STAGE/libEGL.so.1")" = "$(readlink -f "$STAGE/libGL.so.1")" ] || {
            echo "❌ libEGL.so.1 未解析到 libGL.so.1"; ls -la "$STAGE"; exit 1; }
          echo "✅ libEGL.so.1 -> libGL.so.1 链接正确"

          # 实测：libEGL.so.1 必须能被 dlopen 拿到 wine 需要的两个符号，
          # 且客户端扩展串含 egl_init() 硬性要求的两项。
          if ! python3 ci/probe_libegl.py "$STAGE/libEGL.so.1"; then
            echo "❌ libEGL.so.1 不能满足 Wine 的 EGL 加载要求"
            exit 1
          fi
          echo "✅ libEGL.so.1 可用：Wine wgl 的 egl_init 链路验证通过"

          ZTAR="zink-static-${TAG}.tar.gz"
          tar -czf "$ZTAR" -C "$STAGE" .
          sha256sum "$ZTAR" > "${ZTAR}.sha256"
          echo "ZTAR_STATIC=${ZTAR}" >> "$GITHUB_ENV"
          echo "✅ $ZTAR ($(du -h "$ZTAR" | cut -f1))"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAG }}-zink-static
          path: |
            ${{ env.ZTAR_STATIC }}
            ${{ env.ZTAR_STATIC }}.sha256

      - name: 追加到 Release
        if: ${{ env.TAG != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # zink-static 与 build 并行跑，而 Release 是 build job 创建的。
          # 这里轮询等待 Release 出现（最多 15 分钟），而不要直接失败。
          ok=0
          for i in $(seq 1 60); do
            if gh release view "${TAG}" >/dev/null 2>&1; then ok=1; break; fi
            echo "[$i/60] Release ${TAG} 尚未就绪，5s 后重试..."
            sleep 5
          done
          if [ "$ok" = "1" ]; then
            gh release upload "${TAG}" "${ZTAR_STATIC}" "${ZTAR_STATIC}.sha256" --clobber
            echo "✅ 已追加到 Release ${TAG}"
          else
            echo "⚠️ 等待 15 分钟仍未找到 Release ${TAG}，仅保留 artifact"
          fi
